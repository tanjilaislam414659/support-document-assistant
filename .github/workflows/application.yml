name: Local application and portable workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /application/
            /Dockerfile
            /compose.yaml
            /.dockerignore
            /.gitattributes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.11"
      - name: Install default application without research dependencies
        run: |
          python -m pip install setuptools==78.1.0
          python -m pip install -r application/requirements-runtime.txt -r application/requirements-test.txt
          python -m pip install --no-deps --no-build-isolation ./application
          python -m pip check
      - name: API contracts and portable artifact checks
        run: |
          python -m unittest discover -s application/tests -p test_api.py
          python -m unittest discover -s application/tests -p test_portable.py
      - name: Real Chromium synthetic workflow
        run: |
          python -m playwright install --with-deps chromium
          python application/tests/browser_smoke.py --output application/.app-data/ci-browser
      - name: Build and verify default container
        run: |
          docker build -t support-document-assistant:0.2.0 .
          python application/tests/container_smoke.py --output application/.app-data/ci-container.json
