name: support-document-assistant
services:
  support:
    image: support-document-assistant:0.2.0
    build: .
    ports:
      - "127.0.0.1:8010:8010"
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - tickets:/var/lib/support
    stop_grace_period: 10s
    init: true
volumes:
  tickets:
